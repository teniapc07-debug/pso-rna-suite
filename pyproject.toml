[project]
name = "psov2"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "USUARIO", email = "teniapc07@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "freesimplegui>=5.3.0.post1",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scikit-learn>=1.9.1",
    "tensorflow>=2.21.0,<2.22",
]

[project.scripts]
psov2 = "psov2:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: tests que tardan más de 2 segundos (por ejemplo, entrenamiento o PSO completo)",
    "integration: tests que cruzan varias capas del proyecto",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
